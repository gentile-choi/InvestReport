function trySource(src, base){
  return new Promise(function(resolve, reject){
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = ctl ? setTimeout(function(){ ctl.abort(); }, src.timeout) : null;
    fetch(src.url(base), ctl ? {signal: ctl.signal} : {})
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(j){
        if(timer) clearTimeout(timer);
        if(src.getMode){ // allorigins /get 모드는 본문이 contents 문자열에 담김
          if(!j || typeof j.contents !== 'string') throw new Error('no contents');
          j = JSON.parse(j.contents);
        }
        if(j && j.chart && j.chart.result && j.chart.result.length) resolve(j);
        else throw new Error('empty');
      })
      .catch(function(e){ if(timer) clearTimeout(timer); reject(e); });
  });
}

function fetchChart(sym){
  var base = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(sym) + '?range=1y&interval=1d';
  var chain = Promise.reject(new Error('no source'));
  SOURCES.forEach(function(src){
    chain = chain.catch(function(){ return trySource(src, base); });
  });
  return chain;
}

function parseChart(j){
  var r = j.chart.result[0], m = r.meta || {};
  var raw = (((r.indicators || {}).quote || [{}])[0]).close || [];
  var closes = raw.filter(function(x){ return typeof x === 'number'; });
  return { price: m.regularMarketPrice || 0, chg: m.regularMarketChangePercent || 0,
           wk52H: m.fiftyTwoWeekHigh || 0, wk52L: m.fiftyTwoWeekLow || 0, closes: closes };
}

// 동시 실행 제한 풀
function pool(items, limit, worker){
  var i = 0, results = [];
  var runners = [];
  for(var k = 0; k < Math.min(limit, items.length); k++){
    runners.push((function next(){
      var cur = i++;
      if(cur >= items.length) return Promise.resolve();
      return Promise.resolve(worker(items[cur], cur)).then(function(v){ results[cur] = v; return next(); });
    })());
  }
  return Promise.all(runners).then(function(){ return results; });
}

// ---------------- 기술적 지표 ----------------
function sma(c, n){ if(!c || c.length < n) return 0; var s = 0; for(var i = c.length - n; i < c.length; i++) s += c[i]; return s / n; }
function rsi14(c){
  if(!c || c.length < 16) return NaN;
  var ag = 0, al = 0, i, ch;
  for(i = 1; i <= 14; i++){ ch = c[i] - c[i-1]; if(ch > 0) ag += ch; else al -= ch; }
  ag /= 14; al /= 14;
  for(i = 15; i < c.length; i++){ ch = c[i] - c[i-1]; ag = (ag*13 + Math.max(ch,0))/14; al = (al*13 + Math.max(-ch,0))/14; }
  if(al === 0) return 100;
  return 100 - 100/(1 + ag/al);
}
function ret(c, n){ if(!c || c.length <= n || c[c.length-1-n] <= 0) return NaN; return (c[c.length-1]/c[c.length-1-n] - 1) * 100; }

function unitFor(t){
  if(t.cur === 'KRW') return t.price >= 100000 ? 1000 : (t.price >= 10000 ? 500 : 50);
  return t.price >= 500 ? 10 : (t.price >= 100 ? 5 : (t.price >= 50 ? 1 : 0.5));
}
function roundTo(v, u){ return Math.round(v/u)*u; }

function finalize(t){
  if(!t.ok){ t.signal = '⚪ 시세 없음'; t.sigClass = 'r'; t.amount = '확인 필요'; return; }
  if(!isNaN(t.rsi) && t.rsi > 70){ t.signal = '🔴 과열 대기'; t.sigClass = 'r'; t.amount = '모으기 일시중지'; }

  else { t.signal = '🟡 분할·느린 매수'; t.sigClass = 'y'; t.amount = '500원'; }
  var u = unitFor(t);
  t.target = roundTo(t.price * (1 + t.tp), u);

}

  b += '\n━━━━━━━━━━━━━━━━━━\n■ 실시간 시장 스냅샷\n';
  idx.forEach(function(x){
    b += '· ' + x.name + ': ' + idxVal(x) + (x.ok ? ' (' + pctStr(x.chg) + ')' : '') + ' — ' + idxNote(x) + '\n';
  });
  cats.forEach(function(cat, ci){
    b += '\n━━━━━━━━━━━━━━━━━━\n■ ' + CAT_NAMES[ci] + '\n';
    cat.forEach(function(t, i){

      if(t.ok){
        b += '   현재가 ' + money(t, t.price) + ' (' + pctStr(t.chg) + ')\n';
        b += '   의견: ' + t.signal + ' / 모으기: ' + t.amount + '\n';
        b += '   목표가 ' + money(t, t.target) + ' / 손절가 ' + money(t, t.stop) + '\n';
        b += '   RSI ' + t.rsi.toFixed(1) + ' · 1개월 ' + na(t.ret1m, pctStr(t.ret1m)) + ' · 3개월 ' + na(t.ret3m, pctStr(t.ret3m)) + '\n';
      } else b += '   (시세 수집 실패 — 다음 새로고침에서 재시도)\n';
      b += '   선정 이유: ' + t.why + '\n';
      b += '   시작: ' + t.sg + '\n';
      b += '   종료: ' + t.eg + '\n';
    });
  });
  b += '\n━━━━━━━━━━━━━━━━━━\n■ 모으기 시작/종료 원칙\n';
  b += '· 시작: 🟢 200일선 위 → 1,000원 / 🟡 200일선 아래·바닥 신호 → 500원 / 🔴 RSI 70+ 과열 → 일시중지\n';
  b += '· 종료: 목표가 도달 시 1/3 매도 → 20일선 이탈 시 1/3 추가 → 200일선 이탈 시 나머지 매도 검토 / 손절가 이탈(일봉 종가) 시 전량 매도·중단\n';
  b += '\n■ 리스크 관리 규칙\n';
  b += '· 전 종목 손절가(-8~-11%) 설정, 일봉 종가 이탈 시 중단+전량 매도\n';
  b += '· 4개 카테고리 × 5종목 분산, 단일 종목 비중 10% 이내\n';
  b += '· 당일 +5% 이상 급등 종목은 건너뛰거나 절반만 매수\n';
  b += '\n※ ' + STATIC.DISCLAIMER + '\n';

// ---------------- 저장 / 불러오기 ----------------
function saveReport(html, text, ts){
  try {
    localStorage.setItem('rpt.html', html);
    localStorage.setItem('rpt.txt', text);
    localStorage.setItem('rpt.ts', ts);
  } catch(e){ /* 저장 공간 부족 시 무시 */ }
}
function loadSaved(){
  try {
    var h = localStorage.getItem('rpt.html');
    if(!h) return null;
    return { html: h, txt: localStorage.getItem('rpt.txt') || '', ts: localStorage.getItem('rpt.ts') || '-' };
  } catch(e){ return null; }
}

function nowStr(){
  var d = new Date();
  var wk = ['일','월','화','수','목','금','토'][d.getDay()];
  var ap = d.getHours() < 12 ? '오전' : '오후';
  var hh = d.getHours() % 12; if(hh === 0) hh = 12;
  var mm = d.getMinutes();
  return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + wk + ') ' + ap + ' ' + hh + ':' + (mm < 10 ? '0' : '') + mm;
}

}

function setBusy(on){
  busy = on;
  btnRefresh.disabled = on;
  btnShare.disabled = on;
  elStatus.className = on ? '' : 'hidden';
}

function refresh(){
  if(busy) return;
  setBusy(true);
  var idx = INDICES.map(function(x){ return {sym: x.sym, name: x.name, ok: false, price: 0, chg: 0, wk52H: 0}; });
  var cats = makeCats();
  var allSyms = idx.map(function(x){ return {kind:'idx', ref: x, sym: x.sym}; });
  cats.forEach(function(cat){ cat.forEach(function(t){ allSyms.push({kind:'tk', ref: t, sym: t.sym}); }); });
  var total = allSyms.length, done = 0;

  function loadOne(item){
    return fetchChart(item.sym).then(function(j){
      var q = parseChart(j);
      if(item.kind === 'idx'){
        var x = item.ref;
        x.ok = q.price > 0; x.price = q.price; x.chg = q.chg; x.wk52H = q.wk52H;
      } else {
        var t = item.ref;
        t.ok = q.price > 0;
        if(t.ok){
          t.price = q.price; t.chg = q.chg; t.wk52H = q.wk52H; t.wk52L = q.wk52L;
          t.sma20 = sma(q.closes, 20); t.sma50 = sma(q.closes, 50); t.sma200 = sma(q.closes, 200);
          t.rsi = rsi14(q.closes); t.ret1m = ret(q.closes, 21); t.ret3m = ret(q.closes, 63);
        }
      }
      item.done = true;
    }).catch(function(){ /* 일시 실패 — 재시도 라운드에서 다시 시도 */ })
    .then(function(){
      done++;
      elStatusText.textContent = '시세 수집 중 (' + done + '/' + total + ')';
      elBarFill.style.width = Math.round(Math.min(done, total)/total*100) + '%';
    });
  }

  pool(allSyms, 6, loadOne).then(function(){
    var failed = allSyms.filter(function(it){ return !it.done; });
    if(failed.length === 0) return null;
    elStatusText.textContent = '일시 실패 ' + failed.length + '개 종목 재시도 중...';
    return new Promise(function(res){ setTimeout(res, 3000); }).then(function(){
      return pool(failed, 4, loadOne);
    });
  }).then(function(){
    cats.forEach(function(cat){ cat.forEach(finalize); });
    var okCount = 0;
    idx.forEach(function(x){ if(x.ok) okCount++; });
    cats.forEach(function(cat){ cat.forEach(function(t){ if(t.ok) okCount++; }); });
    if(okCount === 0){
      loadExternalData().then(function(dj){
        renderFromDataJson(dj);
        alert('실시간 수집에 실패해 자동 수집된 최신 데이터로 보고서를 표시합니다.');
      }).catch(function(){
        var prev = loadSaved();
        if(prev){ elContent.innerHTML = prev.html; elSub.textContent = '마지막 생성: ' + prev.ts; }
        else { elContent.innerHTML = placeholder(); elSub.textContent = '시세 수집 실패 — 잠시 후 새로고침을 다시 눌러 주세요'; }
        alert('시세를 가져오지 못했습니다. 네트워크 연결을 확인한 뒤 🔄 새로고침을 다시 눌러 주세요.');
      }).then(function(){ setBusy(false); });
      return;
    }
    var ts = nowStr();
    var html = buildHtml(ts, idx, cats, '실시간 시세 기준');
    var text = buildText(ts, idx, cats);
    saveReport(html, text, ts);
    elContent.innerHTML = html;
    elSub.textContent = '마지막 생성: ' + ts;
    window.scrollTo(0, 0);
    setBusy(false);
  });
}

function share(){
  var saved = loadSaved();
  if(!saved){ alert('먼저 🔄 새로고침으로 보고서를 생성해 주세요'); return; }
  var payload = { title: '데일리 투자보고서', text: saved.txt };
  if(navigator.share){
    navigator.share(payload).catch(function(){ /* 사용자가 취소 */ });
  } else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(saved.txt).then(function(){ alert('보고서 전문이 복사되었습니다. 카카오톡 대화창에 붙여넣어 주세요.'); });
  } else {
    alert('이 브라우저에서는 공유를 지원하지 않습니다. 보고서를 길게 눌러 복사해 주세요.');
  }
}

// ---------------- 자동 수집 데이터 (data.json) 지원 ----------------
// 웹앱과 같은 폴더에 data.json이 있으면(GitHub Pages + 자동 수집 워크플로)
// 항상 그 데이터로 보고서를 그린다. 없으면(로컬 파일 실행) 실시간 수집을 사용한다.

function loadExternalData(){
  return fetch('data.json', {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(j){
    if(!j || !j.symbols) throw new Error('bad data.json');
    return j;
  });
}

function reportFromDataJson(dj){
  var idx = INDICES.map(function(x){ return {sym: x.sym, name: x.name, ok: false, price: 0, chg: 0, wk52H: 0}; });
  var cats = makeCats();
  function apply(ref, sym){
    var q = dj.symbols[sym];
    if(!q || !(q.price > 0)) return;
    ref.ok = true; ref.price = q.price; ref.chg = q.chg || 0;
    ref.wk52H = q.wk52H || 0; ref.wk52L = q.wk52L || 0;
    if(ref.cur){ // 개별 종목: 기술지표 계산
      var c = q.closes || [];
      ref.sma20 = sma(c, 20); ref.sma50 = sma(c, 50); ref.sma200 = sma(c, 200);
      ref.rsi = rsi14(c); ref.ret1m = ret(c, 21); ref.ret3m = ret(c, 63);
    }
  }
  idx.forEach(function(x){ apply(x, x.sym); });
  cats.forEach(function(cat){ cat.forEach(function(t){ apply(t, t.sym); }); });
  cats.forEach(function(cat){ cat.forEach(finalize); });
  var genTs = '-', genDate = null;
  if(dj.generated){
    var d = new Date(dj.generated);
    if(!isNaN(d.getTime())){
      genDate = d;
      var hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
      genTs = d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + hh + ':' + mm;
    }
  }
  return { idx: idx, cats: cats, ts: genTs, dateKey: genDate };
}

function renderFromDataJson(dj){
  var rep = reportFromDataJson(dj);
  var html = buildHtml(rep.ts, rep.idx, rep.cats, '자동 수집 데이터 기준');
  var text = buildText(rep.ts, rep.idx, rep.cats);
  saveReport(html, text, rep.ts);
  try {
    if(rep.dateKey) localStorage.setItem('rpt.date', rep.dateKey.getFullYear() + '-' + (rep.dateKey.getMonth()+1) + '-' + rep.dateKey.getDate());
  } catch(e){}
  elContent.innerHTML = html;
  elSub.textContent = '데이터 수집: ' + rep.ts;
  window.scrollTo(0, 0);
}

// 초기 로드:

      var d = new Date();
      var todayKey = d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
      var isToday = false;
      try { isToday = localStorage.getItem('rpt.date') === todayKey; } catch(e){}
      elContent.innerHTML = (isToday ? '' : staleNotice(saved.ts)) + saved.html;
      elSub.textContent = '마지막 생성: ' + saved.ts;
    } else {
      elContent.innerHTML = firstRun();
      elSub.textContent = '최신 시세로 첫 보고서를 자동 생성하는 중...';
      setTimeout(refresh, 400);
    }
  });
})();
