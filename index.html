<script>
'use strict';
/* =====================================================================
   데일리 투자보고서 웹앱 v3 — 기술분석 스코어링 엔진
   - 종목갱신: 자동 수집된 시세 데이터(data.json)로 코스피 상위 200·미국 상위 200·
     소수점 가능 ETF 전체를 기술분석 스코어링하고 순위 추천
   - 새로고침: 가능하면 최신 data.json 재조회→동일 스캔 / 없으면(로컬 파일) 핵심 종목 실시간 수집
   - 스코어 = 추세(35) + 모멘텀(25) + 위치(20) + 거래량(10) + 리스크(10)
===================================================================== */

// ---------------- 공통 지표 ----------------
function sma(c, n){ if(!c || c.length < n) return 0; var s = 0; for(var i = c.length - n; i < c.length; i++) s += c[i]; return s / n; }
function avg(a){ if(!a || !a.length) return 0; var s = 0; for(var i = 0; i < a.length; i++) s += a[i]; return s / a.length; }
function rsi14(c){
  if(!c || c.length < 16) return NaN;
  var ag = 0, al = 0, i, ch;
  for(i = 1; i <= 14; i++){ ch = c[i] - c[i-1]; if(ch > 0) ag += ch; else al -= ch; }
  ag /= 14; al /= 14;
  for(i = 15; i < c.length; i++){ ch = c[i] - c[i-1]; ag = (ag*13 + Math.max(ch,0))/14; al = (al*13 + Math.max(-ch,0))/14; }
  if(al === 0) return 100;
  return 100 - 100/(1 + ag/al);
}
function ret(c, n){ if(!c || c.length <= n || c[c.length-1-n] <= 0) return NaN; return (c[c.length-1]/c[c.length-1-n] - 1) * 100; }

function analyze(sym, q){
  var c = q.closes || [];
  if(c.length < 60) return null;
  var price = q.price > 0 ? q.price : c[c.length-1];
  var sma20 = sma(c,20), sma50 = sma(c,50);
  var has200 = c.length >= 200;
  var sma200 = has200 ? sma(c,200) : 0;
  var rsi = rsi14(c);
  var ret1m = ret(c,21), ret3m = ret(c,63);
  var vols = q.volumes || [];
  var volRatio = (vols.length >= 20 && avg(vols.slice(-20)) > 0) ? avg(vols.slice(-5)) / avg(vols.slice(-20)) : 1;
  var volAnn = null;
  if(c.length >= 22){
    var rs = [];
    for(var i = c.length-21; i < c.length; i++) rs.push(Math.log(c[i]/c[i-1]));
    var mu = avg(rs);
    var va = 0; for(var j = 0; j < rs.length; j++) va += (rs[j]-mu)*(rs[j]-mu);
    va /= (rs.length-1);
    volAnn = Math.sqrt(va) * Math.sqrt(252) * 100;
  }
  var dd = q.wk52H > 0 ? (price/q.wk52H - 1) * 100 : -50;

  // ---- 스코어링 ----
  var S = { trend:0, momentum:0, position:0, volume:0, risk:0 };
  if(sma20 > 0 && price > sma20) S.trend += 8;
  if(sma50 > 0 && price > sma50) S.trend += 9;
  if(has200 && price > sma200) S.trend += 9;
  if(has200 && sma50 > sma200) S.trend += 9;
  if(rsi >= 50 && rsi <= 65) S.momentum += 15;
  else if((rsi >= 45 && rsi < 50) || (rsi > 65 && rsi <= 70)) S.momentum += 10;
  else if((rsi >= 40 && rsi < 45) || (rsi > 70 && rsi <= 75)) S.momentum += 5;
  if(ret1m > 5) S.momentum += 10; else if(ret1m > 0) S.momentum += 7; else if(ret1m > -5) S.momentum += 3;
  if(dd >= -10) S.position += 20; else if(dd >= -20) S.position += 15; else if(dd >= -35) S.position += 10; else S.position += 5;
  if(volRatio >= 1.2) S.volume += 10; else if(volRatio >= 0.9) S.volume += 7; else S.volume += 4;
  if(volAnn != null){
    if(volAnn < 30) S.risk += 10; else if(volAnn < 45) S.risk += 7; else if(volAnn < 60) S.risk += 4; else S.risk += 2;
  } else S.risk += 5;
  var total = S.trend + S.momentum + S.position + S.volume + S.risk;
  var grade = total >= 80 ? 'A' : total >= 70 ? 'B+' : total >= 60 ? 'B' : total >= 50 ? 'C' : 'D';

  var signal, sigClass, amount;
  if((!isNaN(rsi) && rsi > 70) || total < 60){ signal = '🔴 매수 대기'; sigClass = 'r'; amount = '일시중지'; }
  else if(total >= 75){ signal = '🟢 적극 매수'; sigClass = 'g'; amount = '1,000원/일'; }
  else { signal = '🟡 분할 매수'; sigClass = 'y'; amount = '500원/일'; }

  var notes = [];
  if(S.trend >= 32) notes.push('이동평균 정배열');
  else if(S.trend <= 10) notes.push('추세 약함');
  if(rsi >= 50 && rsi <= 65) notes.push('RSI 이상 구간(' + rsi.toFixed(0) + ')');
  if(rsi > 70) notes.push('RSI 과열(' + rsi.toFixed(0) + ')');
  if(dd >= -10) notes.push('52주 신고가 근접');
  else if(dd <= -35) notes.push('고점 대비 깊은 조정');
  if(volRatio >= 1.2) notes.push('거래량 동반');
  if(ret3m > 20) notes.push('3개월 강세');
  if(ret1m < -10) notes.push('단기 급낙 주의');

  var cur = sym.slice(-3) === '.KS' ? 'KRW' : 'USD';
  var unit = unitFor(cur, price);
  return {
    sym: sym, name: q.name || sym, cur: cur, price: price, chg: q.chg || 0,
    rsi: rsi, ret1m: ret1m, ret3m: ret3m, dd: dd, volRatio: volRatio, volAnn: volAnn,
    sma20: sma20, sma50: sma50, sma200: sma200, has200: has200, wk52H: q.wk52H || 0, wk52L: q.wk52L || 0,
    S: S, total: total, grade: grade, signal: signal, sigClass: sigClass, amount: amount,
    notes: notes,
    target: Math.round(price * 1.15 / unit) * unit,
    stop: Math.round(price * 0.90 / unit) * unit
  };
}

function unitFor(cur, price){
  if(cur === 'KRW') return price >= 100000 ? 1000 : (price >= 10000 ? 500 : 50);
  return price >= 500 ? 10 : (price >= 100 ? 5 : (price >= 50 ? 1 : 0.5));
}

// ---------------- 포맷 ----------------
function money(cur, v){
  if(cur === 'KRW') return Math.round(v).toLocaleString('ko-KR') + '원';
  if(v >= 1000) return '$' + Math.round(v).toLocaleString('en-US');
  return '$' + v.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function pctStr(v){ return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
function cls(v){ return v >= 0 ? 'up' : 'dn'; }
function gradeClass(g){ return g.charAt(0) === 'A' ? 'sg-A' : (g.charAt(0) === 'B' ? 'sg-B' : (g.charAt(0) === 'C' ? 'sg-C' : 'sg-D')); }

var IDX_META = [
  ['^KS11','코스피'], ['^KQ11','코스닥'], ['^GSPC','S&P 500'], ['^IXIC','나스닥'], ['^DJI','다우존스'],
  ['^VIX','VIX 공포지수'], ['KRW=X','원/달러 환율'], ['CL=F','국제유가 WTI'], ['GC=F','금']
];

function idxVal(sym, x){
  if(!x || !(x.price > 0)) return '-';
  if(sym.indexOf('KRW') === 0) return x.price.toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '원';
  if(sym.indexOf('=F') > 0 || sym.indexOf('=') > 0) return '$' + x.price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return x.price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function idxNote(sym, x){
  if(!x || !(x.price > 0)) return '데이터 없음';
  if(sym === '^VIX'){
    if(x.price < 15) return '안정적 (방심 금물)';
    if(x.price < 20) return '중립';
    if(x.price < 25) return '경계 필요';
    return '불안 확산 — 분할 매수 유리';
  }
  if(sym === 'KRW=X') return x.price >= 1350 ? '원화 약세 → 달러 자산 환산 유리' : '중립';
  if(sym === 'CL=F') return x.price >= 85 ? '고유가 → 인플레·금리 압력 요인' : '안정';
  if(sym === 'GC=F') return '인플레이션 헤지 자산';
  if(x.wk52H > 0) return '52주 최고 대비 ' + pctStr((x.price/x.wk52H - 1) * 100);
  return '';
}

// ---------------- 스캔 ----------------
function scanUniverse(dj){
  var scored = { kr: [], us: [], etf: [] };
  ['kr','us','etf'].forEach(function(g){
    ((dj.groups || {})[g] || []).forEach(function(sym){
      var q = (dj.symbols || {})[sym];
      if(!q || !q.closes || q.closes.length < 60) return;
      var r = analyze(sym, q);
      if(r){
        var code = sym.slice(0, 6);
        if(KR_NAMES[code]) r.name = KR_NAMES[code];
        scored[g].push(r);
      }
    });
    scored[g].sort(function(a, b){ return b.total - a.total; });
  });
  return scored;
}

function snapshotHtml(indices){
  var h = '<div class="card"><table><tr><th>지표</th><th>현재</th><th>등락</th><th>해설</th></tr>';
  IDX_META.forEach(function(m){
    var x = indices[m[0]];
    h += '<tr><td><b>' + m[1] + '</b></td><td>' + idxVal(m[0], x) + '</td><td>';
    if(x && x.price > 0) h += '<span class="' + cls(x.chg) + '">' + pctStr(x.chg) + '</span>'; else h += '-';
    h += '</td><td class="muted">' + idxNote(m[0], x) + '</td></tr>';
  });
  h += '</table><div class="muted" style="margin-top:8px">기준: 자동 수집 시점 · 해외 지수는 미국 장 기준</div></div>';
  return h;
}

function scoringGuideHtml(){
  return '<div class="card"><b>🧮 기술 점수(0~100) 산출 기준</b>'
    + '<table style="margin-top:6px"><tr><th>항목</th><th>배점</th><th>무엇을 보나</th></tr>'
    + '<tr><td>추세</td><td>35</td><td>가격이 20·50·200일선 위인지, 50일선이 200일선 위인지(정배열)</td></tr>'
    + '<tr><td>모멘텀</td><td>25</td><td>RSI가 이상 구간(50~65)인지, 최근 1개월 수익률이 플러스인지</td></tr>'

function trySource(src, base){
  return new Promise(function(resolve, reject){
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = ctl ? setTimeout(function(){ ctl.abort(); }, src.timeout) : null;
    fetch(src.url(base), ctl ? {signal: ctl.signal} : {})
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(j){
        if(timer) clearTimeout(timer);
        if(src.getMode){
          if(!j || typeof j.contents !== 'string') throw new Error('no contents');
          j = JSON.parse(j.contents);
        }
        if(j && j.chart && j.chart.result && j.chart.result.length) resolve(j);
        else throw new Error('empty');
      })
      .catch(function(e){ if(timer) clearTimeout(timer); reject(e); });
  });
}

function fetchChart(sym){
  var base = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(sym) + '?range=1y&interval=1d';
  var chain = Promise.reject(new Error('no source'));
  SOURCES.forEach(function(src){
    chain = chain.catch(function(){ return trySource(src, base); });
  });
  return chain;
}

function parseChart(j){
  var r = j.chart.result[0], m = r.meta || {};
  var q0 = (((r.indicators || {}).quote || [{}])[0]) || {};
  return {
    name: m.longName || m.shortName || '',
    price: m.regularMarketPrice || 0, chg: m.regularMarketChangePercent || 0,
    wk52H: m.fiftyTwoWeekHigh || 0, wk52L: m.fiftyTwoWeekLow || 0,
    closes: (q0.close || []).filter(function(x){ return typeof x === 'number'; }),
    volumes: (q0.volume || []).filter(function(x){ return typeof x === 'number'; })
  };
}

function pool(items, limit, worker){
  var i = 0, results = [];
  var runners = [];
  for(var k = 0; k < Math.min(limit, items.length); k++){
    runners.push((function next(){
      var cur = i++;
      if(cur >= items.length) return Promise.resolve();
      return Promise.resolve(worker(items[cur], cur)).then(function(v){ results[cur] = v; return next(); });
    })());
  }
  return Promise.all(runners).then(function(){ return results; });
}

    items.forEach(function(it){
      if(!it.q || !(it.q.price > 0)) return;
      var base = { name: it.q.name, price: it.q.price, chg: it.q.chg, wk52H: it.q.wk52H, wk52L: it.q.wk52L, closes: it.q.closes, volumes: it.q.volumes };
      if(LEGACY_IDX.indexOf(it.sym) >= 0){ dj.indices[it.sym] = base; return; }
      dj.symbols[it.sym] = base;
      var info = null;
      LEGACY.forEach(function(L){ if(L[0] === it.sym) info = L; });
      if(info){
        if(info[2] === 'KRW') dj.groups.kr.push(it.sym);
        else if(it.sym.indexOf('.') < 0 && it.sym.length <= 5 && ['VOO','QQQ','SCHD','VGT','VXUS'].indexOf(it.sym) < 0) dj.groups.us.push(it.sym);
        else dj.groups.etf.push(it.sym);
      }
    });
    var okCount = Object.keys(dj.symbols).length + Object.keys(dj.indices).length;
    if(okCount === 0){
      var prev = loadSaved();
      if(prev){ elContent.innerHTML = prev.html; elSub.textContent = '마지막 생성: ' + prev.ts; }
      alert('시세를 가져오지 못했습니다. 네트워크 확인 후 다시 시도해 주세요.');
      setBusy(false);
      return;
    }
    var scored = scanUniverse(dj);
    var ts = nowStr();
    var html = buildScanHtml(ts, dj, scored);
    var text = buildScanText(ts, dj, scored);
    saveReport(html, text, ts);
    elContent.innerHTML = html;
    elSub.textContent = '마지막 생성: ' + ts + ' (실시간 수집)';
    window.scrollTo(0, 0);
    setBusy(false);
  });
}

// ---------------- 메인 동작 ----------------
var elContent = document.getElementById('content');
var elSub = document.getElementById('subLine');
var elStatus = document.getElementById('statusBar');
var elStatusText = document.getElementById('statusText');
var elBarFill = document.getElementById('barFill');
var btnScan = document.getElementById('btnScan');
var btnRefresh = document.getElementById('btnRefresh');
var btnShare = document.getElementById('btnShare');
var busy = false;

function nowStr(){
  var d = new Date();
  var wk = ['일','월','화','수','목','금','토'][d.getDay()];
  var ap = d.getHours() < 12 ? '오전' : '오후';
  var hh = d.getHours() % 12; if(hh === 0) hh = 12;
  var mm = d.getMinutes();
  return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + wk + ') ' + ap + ' ' + hh + ':' + (mm < 10 ? '0' : '') + mm;
}

function setBusy(on){
  busy = on;
  btnScan.disabled = on;
  btnRefresh.disabled = on;
  btnShare.disabled = on;
  elStatus.className = on ? '' : 'hidden';
}

function scanNow(){
  if(busy) return;
  setBusy(true);
  elStatusText.textContent = '수집된 시세 데이터를 불러옵니다...';
  elBarFill.style.width = '30%';
  loadExternalData().then(function(dj){
    elStatusText.textContent = '기술분석 스코어링 계산 중...';
    elBarFill.style.width = '70%';
    var scored = scanUniverse(dj);
    var ts = dataTsStr(dj);
    var html = buildScanHtml(ts, dj, scored);
    var text = buildScanText(ts, dj, scored);
    saveReport(html, text, ts);
    elContent.innerHTML = html;
    elSub.textContent = '데이터 수집: ' + ts;
    elBarFill.style.width = '100%';
    window.scrollTo(0, 0);
    setBusy(false);
  }).catch(function(){
    setBusy(false);
    alert('자동 수집 데이터(data.json)를 찾을 수 없습니다.\n· 웹 주소(깃허브 페이지스)로 접속하셨다면 Actions 수동 실행 후 다시 눌러 주세요.\n· 로컬 파일 실행 중이라면 🔄 새로고침 버튼으로 핵심 종목 실시간 보고서를 이용할 수 있습니다.');
  });
}

function refresh(){
  if(busy) return;
  loadExternalData().then(function(dj){
    var scored = scanUniverse(dj);
    var ts = dataTsStr(dj);
    var html = buildScanHtml(ts, dj, scored);
    var text = buildScanText(ts, dj, scored);
    saveReport(html, text, ts);
    elContent.innerHTML = html;
    elSub.textContent = '데이터 수집: ' + ts;
    window.scrollTo(0, 0);
  }).catch(function(){
    legacyRefresh();
  });
}

function share(){
  var saved = loadSaved();
  if(!saved){ alert('먼저 🔍 종목갱신 또는 🔄 새로고침으로 보고서를 생성해 주세요'); return; }
  var payload = { title: '데일리 투자보고서', text: saved.txt };
  if(navigator.share){
    navigator.share(payload).catch(function(){});
  } else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(saved.txt).then(function(){ alert('보고서가 복사되었습니다. 카카오톡에 붙여넣어 주세요.'); });
  } else {
    alert('이 브라우저에서는 공유를 지원하지 않습니다.');
  }
}

btnScan.addEventListener('click', scanNow);
btnRefresh.addEventListener('click', refresh);
btnShare.addEventListener('click', share);

// ---------------- Android 앱 브리지 (APK 연동용) ----------------
window.__appBridge = {
  version: function(){ return '2.0'; },
  getReportHtml: function(){ try { return localStorage.getItem('rpt.html') || ''; } catch(e){ return ''; } },
  getReportText: function(){ try { return localStorage.getItem('rpt.txt') || ''; } catch(e){ return ''; } },
  getReportTs: function(){ try { return localStorage.getItem('rpt.ts') || ''; } catch(e){ return ''; } },
  doScan: function(){ try { document.getElementById('btnScan').click(); } catch(e){} },
  doRefresh: function(){ try { document.getElementById('btnRefresh').click(); } catch(e){} }
};

// 초기 로드: data.json이 있으면 자동 스캔, 없으면 저장본 또는 실시간 수집
(function init(){
  loadExternalData().then(function(dj){
    var scored = scanUniverse(dj);
    var ts = dataTsStr(dj);
    var html = buildScanHtml(ts, dj, scored);
    var text = buildScanText(ts, dj, scored);
    saveReport(html, text, ts);
    elContent.innerHTML = html;
    elSub.textContent = '데이터 수집: ' + ts;
  }).catch(function(){
    var saved = loadSaved();
    if(saved){
      elContent.innerHTML = saved.html;
      elSub.textContent = '마지막 생성: ' + saved.ts + ' · 새로고침으로 갱신 가능';
    } else {
      elContent.innerHTML = '<div class="card"><h2>📈 첫 보고서 생성 중...</h2><p>실시간 시세를 수집해 기술분석 보고서를 만들고 있습니다. (약 10~20초)</p></div>';
      setTimeout(legacyRefresh, 400);
    }
  });
})();
</script>
