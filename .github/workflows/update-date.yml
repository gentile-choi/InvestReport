name: 시세 자동 수집

on:
  schedule:
    # UTC 기준 월~금 00:00~13:30, 30분 간격 (한국시간 09:00~22:30)
    - cron: "0,30 0-13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 시세 수집
        run: node update-data.mjs
      - name: data.json 커밋 & 페이지스 배포
        run: |
          git config user.name "invest-report-bot"
          git config user.email "invest-report-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "변경 없음" || git commit -m "chore: 시세 데이터 자동 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
